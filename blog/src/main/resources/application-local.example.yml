spring:
  datasource:
    url: jdbc:mysql://localhost:3306/thrivex_local?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your-local-password

hotspot:
  source-base-url: http://localhost:6688
  allow-local-source: true
  max-items-per-source: 20
  sources:
    - platform: zhihu
      platform-name: 知乎
      url: http://localhost:6688/zhihu
      enabled: true
    - platform: douyin
      platform-name: 抖音
      url: http://localhost:6688/douyin
      enabled: true
    - platform: weibo
      platform-name: 微博
      url: https://v2.xxapi.cn/api/weibohot
      enabled: true
    - platform: bilibili
      platform-name: 哔哩哔哩
      url: http://localhost:6688/bilibili
      enabled: true
    - platform: kuaishou
      platform-name: 快手
      url: https://api.itapi.cn/api/hotnews/kuaishou?key=your-shunwei-key
      enabled: true
    - platform: toutiao
      platform-name: 今日头条
      url: http://localhost:6688/toutiao
      enabled: true
    - platform: xiaohongshu
      platform-name: 小红书
      url: https://api.justoneapi.com/api/xiaohongshu/hot-search/v1?token=your-justone-token
      enabled: true
    - platform: xiaohongshu_tikhub
      platform-name: 小红书热搜词(TikHub)
      url: https://api.tikhub.io/api/v1/xiaohongshu/web_v3/fetch_trending
      enabled: false
      headers:
        Authorization: Bearer your-tikhub-token
    - platform: tencent_video
      platform-name: 腾讯视频
      enabled: false
